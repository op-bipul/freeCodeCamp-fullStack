<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="hero">
        <h2>Metric/imperial unit conversion</h2>
        <input id="input-el" type="number">
        <button id="converter-btn">Convert</button>
    </div>

    <div class="result-sec">
        <div class="outputBox">
            <h3>length(Meter/Feet)</h3>
            <p id="length-el"></p>
        </div>
        <div class="outputBox">
            <h3>Volume(Liters/Gallons)</h3>
            <p id="volume-el"></p>
        </div>
        <div class="outputBox">
            <h3>Mass(Kilogram/Pounds)</h3>
            <p id="mass-el"></p>
        </div>
    </div>



    <script src="app.js"></script>
</body>

</html>
